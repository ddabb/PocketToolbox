<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>数独题目</title>
<style>
  body { margin: 0; padding: 40px; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 4px; }
</style>
</head>
<body>
<canvas id="sudoku"></canvas>
<script>
const puzzle = [
  5,3,0,0,7,0,0,0,0,
  6,0,0,1,9,5,0,0,0,
  0,9,8,0,0,0,0,6,0,
  8,0,0,0,6,0,0,0,3,
  4,0,0,8,0,3,0,0,1,
  7,0,0,0,2,0,0,0,6,
  0,6,0,0,0,0,2,8,0,
  0,0,0,4,1,9,0,0,5,
  0,0,0,0,8,0,0,7,9
];

const SIZE = 9;
const CELL = 56;
const PAD = 20;
const BOARD = SIZE * CELL;
const TOTAL = BOARD + 2 * PAD;

const canvas = document.getElementById('sudoku');
canvas.width = TOTAL;
canvas.height = TOTAL;
const ctx = canvas.getContext('2d');

// white bg
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, TOTAL, TOTAL);

// draw thin cell lines
ctx.strokeStyle = '#bfbfbf';
ctx.lineWidth = 1;
for (let i = 0; i <= SIZE; i++) {
  ctx.beginPath();
  ctx.moveTo(PAD + i * CELL, PAD);
  ctx.lineTo(PAD + i * CELL, PAD + BOARD);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(PAD, PAD + i * CELL);
  ctx.lineTo(PAD + BOARD, PAD + i * CELL);
  ctx.stroke();
}

// draw thick 3x3 block lines (overwriting thin ones)
ctx.strokeStyle = '#333333';
ctx.lineWidth = 3;
for (let i = 0; i <= SIZE; i += 3) {
  ctx.beginPath();
  ctx.moveTo(PAD + i * CELL, PAD);
  ctx.lineTo(PAD + i * CELL, PAD + BOARD);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(PAD, PAD + i * CELL);
  ctx.lineTo(PAD + BOARD, PAD + i * CELL);
  ctx.stroke();
}

// outer border (thickest)
ctx.strokeStyle = '#000000';
ctx.lineWidth = 4;
ctx.strokeRect(PAD, PAD, BOARD, BOARD);

// draw numbers
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.font = 'bold 26px "Segoe UI", Arial, sans-serif';
ctx.fillStyle = '#1a1a1a';

for (let r = 0; r < SIZE; r++) {
  for (let c = 0; c < SIZE; c++) {
    const val = puzzle[r * SIZE + c];
    if (val !== 0) {
      const x = PAD + c * CELL + CELL / 2;
      const y = PAD + r * CELL + CELL / 2;
      ctx.fillText(val.toString(), x, y);
    }
  }
}
</script>
</body>
</html>
