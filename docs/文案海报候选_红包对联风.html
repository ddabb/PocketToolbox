<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>红包/对联风 · 文案海报候选（T18 方向 C）</title>
<!-- 槽位映射：tag=横批（顶部金框） / body=大字文案（竖排居中） / sign=落款（右下）；配色字段：bg/bg2=正红渐变 accent=描金 title=金字 sub=浅金 block=横批底 grid=团花纹色 -->
<!-- 风格：高饱和传统红金 + 竖排大字（对联式）+ 铜钱团花装饰；横批置顶、竖批居中、落款右下 -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #58090B;
    overflow: hidden;
    font-family: "Songti SC", "SimSun", "宋体", serif;
  }

  .stage {
    width: 560px;
    height: 560px;
    margin: 10px auto;
    position: relative;
    background: linear-gradient(160deg, #C0181B 0%, #A80F13 48%, #8C0B0F 100%);
    overflow: hidden;
  }

  /* 团花底纹（铜钱式十字圆纹） */
  .coin {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid rgba(244, 208, 124, 0.16);
  }
  .coin::before {
    content: "";
    position: absolute;
    inset: 11px;
    border-radius: 50%;
    border: 2px solid rgba(244, 208, 124, 0.16);
  }
  .coin::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 24px;
    transform: translate(-50%, -50%);
    border-radius: 4px;
    border: 2px solid rgba(244, 208, 124, 0.10);
  }
  .k1 { left: 26px; top: 96px; }
  .k2 { left: 26px; top: 190px; }
  .k3 { left: 26px; top: 284px; }
  .k4 { right: 26px; top: 96px; }
  .k5 { right: 26px; top: 190px; }
  .k6 { right: 26px; top: 284px; }

  /* 内金框 */
  .frame {
    position: absolute;
    inset: 20px;
    border: 2px solid rgba(244, 208, 124, 0.85);
  }
  .frame2 {
    position: absolute;
    inset: 27px;
    border: 1px solid rgba(244, 208, 124, 0.45);
  }

  /* 框角祥云回纹（几何角花） */
  .corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 3px solid #F4D07C;
  }
  .cr1 { left: 34px; top: 34px; border-right: none; border-bottom: none; }
  .cr2 { right: 34px; top: 34px; border-left: none; border-bottom: none; }
  .cr3 { left: 34px; bottom: 34px; border-right: none; border-top: none; }
  .cr4 { right: 34px; bottom: 34px; border-left: none; border-top: none; }

  /* 横批 */
  .tag {
    position: absolute;
    left: 50%;
    top: 54px;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 12px;
    text-indent: 12px;
    color: #FCE9BF;
    padding: 9px 30px;
    background: rgba(140, 11, 15, 0.9);
    border: 1.5px solid #F4D07C;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  /* 竖批主文案：居中竖排大字 */
  .body {
    position: absolute;
    left: 50%;
    top: 148px;
    bottom: 108px;
    transform: translateX(-50%);
    writing-mode: vertical-rl;
    font-size: 44px;
    font-weight: bold;
    letter-spacing: 16px;
    line-height: 1.9;
    color: #FCE9BF;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
  }

  /* 竖批两侧细金线（对联轴线） */
  .axis {
    position: absolute;
    top: 140px;
    bottom: 100px;
    width: 1.5px;
    background: linear-gradient(180deg, transparent, rgba(244, 208, 124, 0.75) 14%, rgba(244, 208, 124, 0.75) 86%, transparent);
  }
  .ax1 { left: 132px; }
  .ax2 { right: 132px; }

  /* 轴头圆坠 */
  .drop {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #F4D07C;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
  }
  .d1 { left: 128px; top: 128px; }
  .d2 { right: 128px; top: 128px; }
  .d3 { left: 128px; bottom: 88px; }
  .d4 { right: 128px; bottom: 88px; }

  /* 固定装饰脚注 */
  .motto {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 58px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 6px;
    text-indent: 6px;
    color: rgba(252, 233, 191, 0.6);
  }

  /* 落款 */
  .sign {
    position: absolute;
    right: 62px;
    bottom: 92px;
    writing-mode: vertical-rl;
    font-size: 14px;
    letter-spacing: 5px;
    color: rgba(252, 233, 191, 0.85);
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(60, 2, 4, 0.42) 100%);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="coin k1"></div><div class="coin k2"></div><div class="coin k3"></div>
  <div class="coin k4"></div><div class="coin k5"></div><div class="coin k6"></div>
  <div class="frame"></div>
  <div class="frame2"></div>
  <div class="corner cr1"></div><div class="corner cr2"></div><div class="corner cr3"></div><div class="corner cr4"></div>
  <div class="axis ax1"></div><div class="axis ax2"></div>
  <div class="drop d1"></div><div class="drop d2"></div><div class="drop d3"></div><div class="drop d4"></div>
  <div class="tag">新春大吉</div>
  <div class="body">岁岁平安，万事胜意</div>
  <div class="sign">—— 随身工具宝</div>
  <div class="motto">HAPPY NEW YEAR · POCKET BLESSING</div>
  <div class="vignette"></div>
</div>

</body>
</html>
