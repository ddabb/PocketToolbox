<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电影字幕卡 · 文案海报候选</title>
<!-- 槽位映射：tag=片头厂牌（POCKET 电影） / body=片名字体 / sign=副标署名；配色字段：bg/bg2=夜幕渐变 accent=金线 title=字幕银 sub=次要文字 block=胶片条 grid=片孔色 -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07070B;
    overflow: hidden;
    font-family: Georgia, "SimSun", "宋体", serif;
  }

  .stage {
    width: 560px;
    height: 560px;
    margin: 10px auto;
    position: relative;
    background: linear-gradient(180deg, #07070B 0%, #0D0D14 55%, #101018 100%);
    overflow: hidden;
  }

  .glow {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 420px;
    height: 420px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(201, 165, 92, 0.10) 0%, transparent 62%);
  }

  .strip {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34px;
    background: #15151C;
  }
  .strip.l { left: 0; }
  .strip.r { right: 0; }
  .holes {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }
  .hole {
    width: 16px;
    height: 12px;
    border-radius: 3px;
    background: #040406;
    box-shadow: inset 0 1.5px 3px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.04);
  }

  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0 88px;
    box-sizing: border-box;
    text-align: center;
  }

  .studio {
    font-size: 12px;
    letter-spacing: 7px;
    color: #8A867C;
    text-indent: 7px;
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }

  .goldline {
    width: 42px;
    height: 2px;
    background: #C9A55C;
    margin: 18px 0 26px;
  }

  .title {
    font-size: 34px;
    color: #ECE8E0;
    letter-spacing: 5px;
    line-height: 1.5;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
    font-weight: bold;
  }

  .signline {
    margin-top: 24px;
    font-style: italic;
    font-size: 17px;
    color: #B8B2A4;
    letter-spacing: 3px;
  }

  .goldline2 {
    width: 26px;
    height: 1.5px;
    background: rgba(201, 165, 92, 0.55);
    margin: 26px 0 18px;
  }

  .coming {
    font-size: 10px;
    letter-spacing: 5px;
    color: #8A867C;
    text-indent: 5px;
    font-family: Arial, sans-serif;
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.09;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.8'/></svg>");
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 46%, rgba(0,0,0,0.78) 100%);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="glow"></div>
  <div class="strip l"><div class="holes">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
  </div></div>
  <div class="strip r"><div class="holes">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
  </div></div>
  <div class="center">
    <div class="studio">POCKET 电影</div>
    <div class="goldline"></div>
    <div class="title">欢迎来访公众号<br>「随身工具宝」</div>
    <div class="signline">请你喝茶呀</div>
    <div class="goldline2"></div>
    <div class="coming">COMING SOON · OCT 2026</div>
  </div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

</body>
</html>
