<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>聊天气泡 · 文案海报候选</title>
<!-- 槽位映射：tag=对方昵称（随身工具宝） / body=左侧消息 / sign=我方回复；配色字段：bg=聊天区底 accent=我方气泡 title=正文墨 sub=次要文字 block=对方气泡 grid=顶栏底色 -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #141109;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .stage {
    width: 560px;
    height: 560px;
    margin: 10px auto;
    position: relative;
    background: #EDEDED;
    display: flex;
    flex-direction: column;
  }

  .header {
    height: 66px;
    background: #E4E4E4;
    border-bottom: 1px solid #D5D5D5;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 11px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .hava {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: #95EC69;
    color: #191919;
    font-size: 19px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hname { font-size: 16px; font-weight: bold; color: #191919; line-height: 1.2; }
  .hsub { font-size: 10px; color: #8A8A8A; margin-top: 2px; }
  .hdots {
    margin-left: auto;
    color: #6A6A6A;
    font-size: 18px;
    letter-spacing: 2px;
  }

  .chat {
    flex: 1;
    padding: 18px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-sizing: border-box;
  }

  .timepill {
    align-self: center;
    font-size: 10px;
    color: #8A8A8A;
    background: #DEDEDE;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .msgrow { display: flex; gap: 9px; align-items: flex-start; }
  .msgrow.right { flex-direction: row-reverse; }

  .ava {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
  }
  .ava.l { background: #95EC69; color: #191919; }
  .ava.r { background: #D9E8D2; color: #2E4A28; }

  .bubble {
    max-width: 68%;
    padding: 11px 14px;
    font-size: 15.5px;
    line-height: 1.55;
    box-shadow: 0 2px 5px rgba(0,0,0,0.07);
  }
  .bubble.l {
    background: #FFFFFF;
    color: #191919;
    border-radius: 12px;
    border-top-left-radius: 4px;
  }
  .bubble.r {
    background: #95EC69;
    color: #191919;
    border-radius: 12px;
    border-top-right-radius: 4px;
  }
  .bubble .rich { font-weight: bold; }

  .spacer { flex: 1; }

  .inputbar {
    height: 58px;
    background: #F7F7F7;
    border-top: 1px solid #DCDCDC;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .roundbtn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #7A7A7A;
    flex-shrink: 0;
  }
  .roundbtn.plus { border: 1.8px solid #B8B8B8; font-weight: 300; }
  .roundbtn.mic { border: 1.8px solid #B8B8B8; font-size: 15px; }
  .inputpill {
    flex: 1;
    height: 36px;
    background: #FFFFFF;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px #E2E2E2;
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: #B8B8B8;
    font-size: 13px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="header">
    <div class="hava">随</div>
    <div>
      <div class="hname">随身工具宝</div>
      <div class="hsub">公众号</div>
    </div>
    <div class="hdots">···</div>
  </div>

  <div class="chat">
    <div class="timepill">18:05</div>
    <div class="msgrow">
      <div class="ava l">随</div>
      <div class="bubble l">欢迎来访公众号<br><span class="rich">「随身工具宝」</span></div>
    </div>
    <div class="spacer"></div>
    <div class="msgrow right">
      <div class="ava r">宝</div>
      <div class="bubble r">请你喝茶呀</div>
    </div>
  </div>

  <div class="inputbar">
    <div class="roundbtn plus">+</div>
    <div class="inputpill">···</div>
    <div class="roundbtn mic">◉</div>
  </div>
</div>

</body>
</html>
