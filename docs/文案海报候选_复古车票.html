<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>复古车票 · 文案海报候选</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #141109;
    overflow: hidden;
    font-family: Georgia, "SimSun", "宋体", serif;
  }

  .stage {
    width: 620px;
    height: 480px;
    margin: 10px auto;
    position: relative;
    background: radial-gradient(ellipse at 50% 20%, #2a2216 0%, #171208 60%, #0d0a05 100%);
  }

  .ticket {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 520px;
    height: 290px;
    transform: translate(-50%, -50%) rotate(-3deg);
    display: flex;
    background: linear-gradient(160deg, #f6eeda 0%, #efe3c8 60%, #e7d8b8 100%);
    box-shadow: 0 22px 55px rgba(0,0,0,0.65), inset 0 0 40px rgba(180,150,100,0.12);
    border-radius: 6px;
  }

  .main {
    flex: 1.7;
    padding: 24px 26px 20px;
    position: relative;
    box-sizing: border-box;
  }

  .trow {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .ttitle {
    font-size: 12px;
    letter-spacing: 4px;
    color: #7a6a4d;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }
  .tno {
    font-size: 13px;
    color: #5d5138;
    font-style: italic;
  }

  .div {
    margin: 12px 0 20px;
    height: 3px;
    border-top: 1px solid #c8b794;
    border-bottom: 1px solid #c8b794;
  }

  .quote {
    font-size: 28px;
    color: #2e281d;
    line-height: 1.5;
    letter-spacing: 1px;
  }

  .meta {
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 18px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #6b5c40;
  }
  .meta b {
    color: #3a3222;
  }

  .stub {
    width: 150px;
    border-left: 2px dashed #bfae8c;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .notch {
    position: absolute;
    left: -11px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #171208;
  }
  .notch.top { top: -10px; }
  .notch.bot { bottom: -10px; }

  .stublabel {
    font-size: 11px;
    letter-spacing: 3px;
    color: #8a7a58;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }

  .barcode {
    width: 96px;
    height: 46px;
    background: repeating-linear-gradient(90deg,
      #2e281d 0 2px, transparent 2px 5px,
      #2e281d 5px 6px, transparent 6px 10px,
      #2e281d 10px 13px, transparent 13px 15px,
      #2e281d 15px 16px, transparent 16px 19px);
  }

  .serial {
    font-size: 11px;
    color: #5d5138;
    letter-spacing: 2px;
    font-family: Arial, sans-serif;
  }

  .stubvertical {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-size: 12px;
    letter-spacing: 6px;
    color: #8a7a58;
  }

  .stamp {
    position: absolute;
    right: 104px;
    top: -28px;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    border: 3px solid rgba(196,74,58,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transform: rotate(-14deg);
    color: rgba(196,74,58,0.85);
    mix-blend-mode: multiply;
    z-index: 3;
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(196,74,58,0.55);
    border-radius: 50%;
  }
  .stamp .zh {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .stamp .star {
    font-size: 12px;
  }
  .stamp .en {
    font-size: 9px;
    letter-spacing: 3px;
    font-family: Arial, sans-serif;
  }

  .punch {
    position: absolute;
    left: 14px;
    bottom: 16px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #171208;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.7);
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.14;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.72) 100%);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ticket">
    <div class="main">
      <div class="trow">
        <div class="ttitle">QUOTATION TICKET</div>
        <div class="tno">No. 00128</div>
      </div>
      <div class="div"></div>
      <div class="quote">“欢迎来访公众号<br>「随身工具宝」”</div>
      <div class="meta"><span>签发 <b>请你喝茶呀</b></span><span>2026 · 10 · 11</span></div>
    </div>
    <div class="stub">
      <div class="notch top"></div>
      <div class="notch bot"></div>
      <div class="stublabel">KEEP</div>
      <div class="barcode"></div>
      <div class="serial">0-0128-26</div>
      <div class="stubvertical">随身工具宝</div>
    </div>
    <div class="stamp">
      <div class="zh">随身工具宝</div>
      <div class="star">★ ★ ★</div>
      <div class="en">APPROVED</div>
    </div>
    <div class="punch"></div>
    <div class="grain"></div>
  </div>
  <div class="vignette"></div>
</div>

</body>
</html>
