<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CRT 终端屏 · 文案海报候选</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: "SimSun", "宋体", "Courier New", monospace;
  }

  .stage {
    width: 600px;
    height: 540px;
    margin: 10px auto;
    position: relative;
    perspective: 1200px;
  }

  .monitor {
    position: absolute;
    left: 60px;
    top: 40px;
    width: 480px;
    height: 440px;
    background: linear-gradient(165deg, #dcd6c8 0%, #d0c9b9 50%, #bcb4a1 100%);
    border-radius: 28px 28px 36px 36px;
    box-shadow:
      0 26px 60px rgba(0,0,0,0.8),
      inset 0 2px 0 rgba(255,255,255,0.6),
      inset 0 -4px 10px rgba(0,0,0,0.22),
      inset 3px 0 6px rgba(255,255,255,0.18);
    transform: rotate(-3deg) rotateX(10deg) rotateY(-5deg);
    padding: 26px 34px 0;
    box-sizing: border-box;
  }

  .screen {
    height: 302px;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #0a2c13 0%, #051b0c 55%, #020d06 100%);
    box-shadow:
      inset 0 0 50px rgba(0,0,0,0.88),
      inset 0 0 10px rgba(0,0,0,0.9),
      0 0 26px rgba(60,255,130,0.14);
    padding: 26px 28px;
    box-sizing: border-box;
    color: #3aff90;
    text-shadow: 0 0 3px rgba(58,255,144,0.9), 0 0 11px rgba(58,255,144,0.4);
    font-size: 22px;
    line-height: 1.55;
  }

  .glass {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: linear-gradient(115deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 22%, transparent 40%);
  }

  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,0.26) 0px,
      rgba(0,0,0,0.26) 1px,
      transparent 1px,
      transparent 3px);
    animation: tflick 4s infinite;
  }
  @keyframes tflick {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.93; }
  }

  .dim {
    color: #7dffb9;
    font-size: 19px;
    text-shadow: 0 0 3px rgba(58,255,144,0.55);
  }

  .trule {
    height: 1px;
    background: rgba(58,255,144,0.45);
    margin: 16px 0 20px;
    box-shadow: 0 0 6px rgba(58,255,144,0.4);
  }

  .main {
    font-size: 25px;
    letter-spacing: 1px;
  }

  .prompt {
    margin-top: 24px;
    font-size: 21px;
  }

  .cursor {
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .chin {
    position: relative;
    height: 86px;
  }
  .brand {
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 5px;
    color: #8d8471;
    font-family: Georgia, serif;
  }
  .led {
    position: absolute;
    left: 6px;
    top: 36px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb0a0, #ff4433 60%, #b81c0e);
    box-shadow: 0 0 8px rgba(255,68,51,0.8);
  }
  .knob {
    position: absolute;
    top: 32px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #efeade, #cfc7b4 70%);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.5);
  }
  .knob::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 2px;
    width: 2px;
    height: 7px;
    background: #8d8471;
    transform: translateX(-50%);
  }
  .knob.k1 { right: 66px; transform: rotate(-30deg); }
  .knob.k2 { right: 30px; transform: rotate(20deg); }

  .noise {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 8;
    opacity: 0.16;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.7'/></svg>");
    mix-blend-mode: screen;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.85) 100%);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="monitor">
    <div class="screen">
      <div class="dim">C:\&gt; type quote.txt</div>
      <div class="trule"></div>
      <div class="main">欢迎来访公众号「随身工具宝」</div>
      <div class="prompt">&gt; -- 请你喝茶呀<span class="cursor">▌</span></div>
      <div class="glass"></div>
      <div class="scanlines"></div>
    </div>
    <div class="chin">
      <div class="led"></div>
      <div class="brand">PHOSPHOR · 80C</div>
      <div class="knob k1"></div>
      <div class="knob k2"></div>
    </div>
    <div class="noise"></div>
    <div class="vignette"></div>
  </div>
</div>

</body>
</html>
