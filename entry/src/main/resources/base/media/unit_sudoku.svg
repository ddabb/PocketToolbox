<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="12" fill="#6366f1"/>
  <g transform="translate(10,10)" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer border -->
    <rect x="0" y="0" width="27" height="27" rx="1.5" stroke-width="2"/>
    <!-- horizontal lines -->
    <line x1="0" y1="9" x2="27" y2="9"/>
    <line x1="0" y1="18" x2="27" y2="18"/>
    <!-- vertical lines -->
    <line x1="9" y1="0" x2="9" y2="27"/>
    <line x1="18" y1="0" x2="18" y2="27"/>
    <!-- thicker 3x3 block lines -->
    <line x1="0" y1="9" x2="27" y2="9" stroke-width="2"/>
    <line x1="0" y1="18" x2="27" y2="18" stroke-width="2"/>
    <line x1="9" y1="0" x2="9" y2="27" stroke-width="2"/>
    <line x1="18" y1="0" x2="18" y2="27" stroke-width="2"/>
  </g>
  <!-- numbers -->
  <g fill="white" font-size="4.2" font-family="sans-serif" font-weight="500" text-anchor="middle" transform="translate(10,10)">
    <text x="4.5" y="6.8">5</text>
    <text x="13.5" y="6.8">3</text>
    <text x="22.5" y="6.8">7</text>
    <text x="4.5" y="15.8">6</text>
    <text x="22.5" y="15.8">1</text>
    <text x="13.5" y="24.8">9</text>
    <text x="22.5" y="24.8">2</text>
  </g>
</svg>
