<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="12" fill="#D8231A"/>
  <!-- 拼音 xué（SVG text 对拉丁小写渲染失效，用线段绘制 x/u/e + 二声声调） -->
  <g stroke="white" stroke-width="0.9" stroke-linecap="round" fill="none">
    <line x1="16.9" y1="6" x2="20.7" y2="10.6"/>
    <line x1="20.7" y1="6" x2="16.9" y2="10.6"/>
    <line x1="22.1" y1="6" x2="22.1" y2="9.6"/>
    <line x1="25.9" y1="6" x2="25.9" y2="9.6"/>
    <path d="M22.1,9.6 A1.9,1.9 0 0 0 25.9,9.6"/>
    <circle cx="29.1" cy="8.3" r="2.1"/>
    <line x1="27.3" y1="8.3" x2="30.5" y2="8.3"/>
    <line x1="27.5" y1="5.2" x2="30.1" y2="4.3"/>
  </g>
  <!-- 米字格：十字虚线 + 对角虚线 -->
  <g fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
    <line x1="12.5" y1="26" x2="35.5" y2="26" stroke-dasharray="2.4 2.2"/>
    <line x1="24" y1="14.5" x2="24" y2="37.5" stroke-dasharray="2.4 2.2"/>
    <line x1="12.5" y1="14.5" x2="35.5" y2="37.5" stroke-dasharray="2.4 2.2"/>
    <line x1="35.5" y1="14.5" x2="12.5" y2="37.5" stroke-dasharray="2.4 2.2"/>
  </g>
  <!-- 外框实线 -->
  <rect x="12.5" y="14.5" width="23" height="23" rx="1.5" fill="none" stroke="white" stroke-width="2"/>
  <!-- 米字格内的"学"字 -->
  <text x="24" y="31.6" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="600" fill="white">学</text>
</svg>
